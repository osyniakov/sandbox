<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8b2ff0" />
    <!-- Fonts (sandbox-2pc.1): Figtree body, Bricolage Grotesque display,
         JetBrains Mono for numbers/code. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Basement Declutter</title>
    <!-- Google Identity Services (GIS) client library: renders the Sign
         In with Google button and issues the ID token SignInPage.jsx
         exchanges for a session token via `POST /api/auth/google`. Loaded
         async/defer since it's not needed for first paint (the sign-in
         gate itself is plain React/Tailwind); SignInPage.jsx polls for
         `window.google` to be ready before initializing it. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
