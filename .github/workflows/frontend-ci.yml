name: Frontend CI

on:
  # push only for master; PR branches are covered by pull_request,
  # so they don't run every job twice.
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'scripts/license_scan.py'
      - 'license-config.json'
      - 'LICENSE-3rdparty.csv'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/license_scan.py'
      - 'license-config.json'
      - 'LICENSE-3rdparty.csv'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # npm half of the license scan (python half runs in backend-ci.yml).
      # Runs `python3 ../scripts/license_scan.py check --npm` from frontend/.
      - name: License scan (npm)
        run: npm run license
