# Canonical way to run the e2e suite: trigger manually (Actions -> "E2E Tests"
# -> Run workflow) after a deploy finishes. It does not run automatically on
# merge. Required repository secrets (Settings -> Secrets and variables ->
# Actions):
#   E2E_FRONTEND_URL   - base URL of the deployed frontend under test
#   E2E_SESSION_SECRET - deployed backend's real SESSION_SECRET
#   E2E_TEST_EMAIL     - test identity email (no whitelisting needed; runs in its own workspace)
name: E2E Tests

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_FRONTEND_URL: ${{ secrets.E2E_FRONTEND_URL }}
      E2E_SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: e2e/test-results/
