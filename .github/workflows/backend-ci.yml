name: Backend CI

on:
  # push only for master; PR branches are covered by pull_request,
  # so they don't run every job twice.
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'scripts/license_scan.py'
      - 'license-config.json'
      - 'LICENSE-3rdparty.csv'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/license_scan.py'
      - 'license-config.json'
      - 'LICENSE-3rdparty.csv'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints.txt

      - name: Run tests
        run: pytest

      # Python half of the license scan. The full (exact) check needs both
      # ecosystems, but the npm half needs frontend/node_modules, so it runs in
      # frontend-ci.yml (`npm run license`) instead of making this job depend
      # on Node. These partial checks verify the rows they scan; a row for a
      # removed component is not caught by CI (needs a full local `generate`).
      # pip-licenses is a dev tool, not a runtime requirement; exact pin.
      - name: Install license scan tool
        working-directory: .
        run: pip install -c backend/constraints.txt pip-licenses==5.5.5

      - name: License scan (python)
        working-directory: .
        run: python scripts/license_scan.py check --python
