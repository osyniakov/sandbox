name: CI

on:
  # push only for master; PR branches are covered by pull_request,
  # so they don't run every job twice.
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # VITE_GOOGLE_CLIENT_ID is a build-time placeholder, not a secret.
      - name: Build image
        run: docker build --build-arg VITE_GOOGLE_CLIENT_ID=ci-placeholder -t sandbox:ci .

      - name: Start container
        run: >
          docker run -d --name app -p 8000:8000
          -e SESSION_SECRET=ci-only-not-secret
          -e DATA_DIR=/tmp/data
          sandbox:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy after $i attempt(s)"
              exit 0
            fi
            echo "attempt $i: got HTTP $code"
            sleep 2
          done
          echo "health check never returned 200"
          exit 1

      - name: Check frontend is served
        run: curl -fsS http://localhost:8000/ | grep -q '<div id="root">'

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs app || true
          docker rm -f app || true
